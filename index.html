<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гипотеза тренажері</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e2e0d8;--acc:#1f5f8b;--ok:#1e7a46;--bad:#b3261e;--warn:#8a5a00;--code:#f0efe9;--tip:#fff7e0;--tipline:#e9d79c;--hl1:#e3effa;--hl2:#fdeee0;--hl3:#e6f4ea;--hl4:#f1e9f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1d;--ink:#ecebe6;--mute:#a09e96;--line:#34332f;--acc:#7cb4dc;--ok:#6cc98f;--bad:#f08a80;--warn:#e0b45a;--code:#2a2926;--tip:#2b2618;--tipline:#5a4d27;--hl1:#1d2b38;--hl2:#3a2a1c;--hl3:#1c3324;--hl4:#2e2338}}
:root[data-theme="dark"]{--bg:#161615;--card:#201f1d;--ink:#ecebe6;--mute:#a09e96;--line:#34332f;--acc:#7cb4dc;--ok:#6cc98f;--bad:#f08a80;--warn:#e0b45a;--code:#2a2926;--tip:#2b2618;--tipline:#5a4d27;--hl1:#1d2b38;--hl2:#3a2a1c;--hl3:#1c3324;--hl4:#2e2338}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 12px}
h3{font-size:1rem;margin:18px 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 16px;scroll-margin-top:60px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;margin-top:14px}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
code,pre{background:var(--code);border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
code{padding:1px 5px}pre{padding:10px 12px;overflow-x:auto;white-space:pre-wrap}
ol li,ul li{margin-bottom:6px}
.fb{font-size:.92rem;margin-top:4px;min-height:1.2em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--warn)}
.fb .more{color:var(--ink);background:var(--tip);border:1px solid var(--tipline);border-radius:8px;padding:8px 10px;margin-top:6px}
.fb .more b{display:block;margin-bottom:2px}
.fb .extra{color:var(--mute);margin-top:4px}
.fb ul{margin:4px 0 0;padding-left:20px}
.hidden{display:none}
.note{color:var(--mute);font-size:.92rem}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.lang button{margin:0;padding:4px 12px;font-size:.85rem;background:transparent;color:var(--acc);border:1px solid var(--acc)}
.lang button.on{background:var(--acc);color:#fff}
.ex{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:.93rem}
.ex th,.ex td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.ex th:first-child,.ex td:first-child{text-align:left}
.ex th{color:var(--mute);font-weight:600}
.tw{overflow-x:auto}
.key{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:10px 0}
nav.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.steps a{font-size:.85rem;text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item .q{font-weight:600;margin-bottom:6px}
.item .sec{font-size:.78rem;color:var(--mute);font-weight:400;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.col{flex-direction:column}
.opts label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opts label.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opts input{width:auto;margin-top:4px}
.chk label{display:flex;gap:8px;font-weight:400;margin:6px 0}
.chk input{width:auto;margin-top:4px}
.preview{background:var(--code);border-radius:8px;padding:10px 12px;margin-top:10px;min-height:2.6em}
.preview .gap{color:var(--bad)}
.story{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg)}
.story h3{margin-top:0;font-size:1.1rem}
.story p{margin:8px 0;padding:6px 8px;border-radius:6px}
.story .lab{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.p-lead{background:var(--hl1)}.p-nut{background:var(--hl2)}.p-ev{background:var(--hl3)}.p-src{background:var(--hl4);font-size:.9rem}
.badge{display:inline-block;font-size:.78rem;font-weight:700;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:1px 8px;margin-bottom:8px}
.num{display:grid;grid-template-columns:1fr 130px;gap:6px 12px;align-items:center;margin-top:10px}
.num label{margin:0;font-weight:500}
.num .fb{grid-column:1/-1;margin-top:0}
@media (max-width:520px){.num{grid-template-columns:1fr 100px}}
.score{font-weight:600;margin-top:8px}
</style>
</head>

 en:{h:"The hypothesis box is empty. Fill in the builder, press \"Copy the draft\", then polish the sentence yourself.", m:""}},

/* --- 2-қадам: төркін жаттығуы --- */
secondary:{kk:{h:"Бұл санды қайталап жазған дереккөз, санды жинаған орган емес.",
  m:"Төркін деп датаны өзі жинаған органды, оның нақты кестесін және жылдарын айтамыз. Сайт, арна, агенттік оны қайталайды. Тізбек бойымен жоғары көтеріліп, кестеге жетіңіз."},
 en:{h:"This source repeats the number; it didn't collect it.",
  m:"The origin is the body that collected the data, its exact table and years. Sites, channels and agencies repeat it. Follow the chain up to the table."}},
press:{kk:{h:"Пресс-релиз санды хабарлайды, бірақ өзі датасет емес.",
  m:"Пресс-релизде кейде сан дөңгелектеніп, кейде ыңғайлы жылдар ғана алынады. Сол органның не статистика бюросының кестесін тауып, санды өзіңіз салыстырыңыз."},
 en:{h:"A press release reports a number, but it isn't a dataset.",
  m:"Press releases round numbers and pick convenient years. Find the table (the body's own, or the statistics bureau's) and check the number yourself."}},
person:{kk:{h:"Адамның сөзі дата емес, ол тексерілетін тұжырым.",
  m:"Сарапшының, дәрігердің не экономистің пікірі мақалаға дауыс береді, бірақ санның төркіні бола алмайды."},
 en:{h:"A person's words aren't data; they're a claim to be checked.",
  m:"An expert's, doctor's or economist's view gives the story a voice, but it can't be the origin of a number."}},
pct:{kk:{h:"Біреудің дайын пайызы: ол қандай кестеден, қай жылдардан есептелгені белгісіз.",
  m:"Дайын пайызды ешқашан көшірмеңіз. Бастапқы кестені тауып, ЖЕБЕ-мен өзіңіз қайта есептеңіз. Сәйкес келмесе, айырманың себебін іздеңіз."},
 en:{h:"Someone else's ready-made percentage: we don't know which table or years it came from.",
  m:"Never copy a ready-made percentage. Find the original table and recalculate it yourself with DART. If it doesn't match, find out why."}},
authority:{kk:{h:"Шенеуніктің мәлімдемесі не жоққа шығаруы дата емес.",
  m:"Министр «жақсарды» десе де, «жоқ» десе де, бұл тексерілетін тұжырым. Гипотезаның тағдырын тек өлшеу шешеді."},
 en:{h:"An official's statement or denial isn't data.",
  m:"Whether a minister says \"it improved\" or \"it didn't happen\", that's a claim to test. Only measurement decides a hypothesis."}},
anecdote:{kk:{h:"Тұрғындардың шағымы оқиғаның бар екенін көрсетеді, бірақ оның көлемін өлшемейді.",
  m:"Шағым кейіпкер табуға көмектеседі. Өзгерістің көлемін өлшеу үшін бекеттердің жүйелі өлшеуі керек."},
 en:{h:"Residents' complaints show the problem exists, but don't measure its size.",
  m:"Complaints help you find people to interview. Measuring change needs systematic readings from monitoring stations."}},

/* --- 2-қадам: өз датаңыз --- */
s2body:{kk:{h:"Датаны жинаған органды жазыңыз (мысалы, Ұлттық статистика бюросы).", m:"Мақалада «мәлімет бойынша» деп қана жазылса, органды өзіңіз іздеп табасыз. Таппасаңыз, бұл сары не қызыл белгі."},
 en:{h:"Name the body that collected the data (e.g. Bureau of National Statistics).", m:"If the article only says \"according to data\", you have to find the body yourself. If you can't, that's a yellow or red flag."}},
s2table:{kk:{h:"Кестенің не көрсеткіштің нақты атауын жазыңыз.", m:"Атауы нақты болса, басқа адам дәл сол файлды таба алады. Бұл дереккөз жолына да керек болады (7-қадам)."},
 en:{h:"Write the exact name of the table or indicator.", m:"With an exact name, someone else can find the same file. You'll need it for the source line too (step 7)."}},
s2years:{kk:{h:"Датаның қай жылдарды қамтитынын жазыңыз: бастапқы және соңғы жыл.", m:"Кейін гипотезаның жылдары осы аралыққа сыя ма, соны тексереміз (3-қадам)."},
 en:{h:"Write which years the data covers: first and last year.", m:"Later we check whether your hypothesis's years fit inside this range (step 3)."}},
s2level:{kk:{h:"Датаның бөлінісін таңдаңыз: ел, облыс, қала, аудан.", m:"Ең жиі шығатын кедергі осы: гипотеза аудан туралы, дата облыс бойынша."},
 en:{h:"Choose the data's breakdown: country, region, city, district.", m:"This is the most common obstacle: a district-level hypothesis with regional data."}},
s2type:{kk:{h:"Дереккөздің түрін таңдаңыз.", m:""}, en:{h:"Choose the type of source.", m:""}},
srcRed:{kk:{h:"Бұл түс қызыл: пресс-релиз, мақала, адамның сөзі не біреудің дайын пайызы датасет емес.",
  m:"Гипотезаны тексеру үшін кесте керек. Осы дереккөз сілтеме жасаған органды тауып, оның кестесіне жетіңіз. Таппасаңыз, тақырыпты бекітпеңіз: семестр ортасында тақырып ауыстырудың бір себебі осы."},
 en:{h:"This is red: a press release, article, statement or someone's percentage isn't a dataset.",
  m:"Testing a hypothesis needs a table. Find the body this source relies on and get to its table. If you can't, don't lock in the topic: this is one of the reasons students end up changing topics mid-semester."}},
srcSecond:{kk:{h:"Бұл бастапқы дереккөз емес. Санды жинаған органға дейін жетіңіз.", m:"Екінші қолдан алынған санда қате, дөңгелектеу не ыңғайлы жыл таңдау болуы мүмкін."},
 en:{h:"This isn't the primary source. Trace it back to the body that collected it.", m:"Second-hand numbers can carry errors, rounding or cherry-picked years."}},
srcUnknown:{kk:{h:"Бастапқы дереккөз бе, жоқ па, анықтаңыз.", m:"Сұраңыз: бұл санды кім өлшеді не санады? Сол органның сайтында сол сан бар ма?"},
 en:{h:"Find out whether it's the primary source.", m:"Ask: who measured or counted this? Is the same number on that body's website?"}},

/* --- 1-қадам --- */
s1sector:{kk:{h:"Алты сектордың бірін таңдаңыз.", m:""}, en:{h:"Choose one of the six sectors.", m:""}},
s1link:{kk:{h:"Мақаланың толық сілтемесін қойыңыз (https://...).", m:"Сілтеме ашылатынын өзіңіз тексеріңіз. ЖИ ұсынған сілтеме болса, міндетті түрде ашып көріңіз (Лаб 3)."},
 en:{h:"Paste the article's full link (https://...).", m:"Check that it opens. If an AI suggested it, open it without fail (Lab 3)."}},
s1num:{kk:{h:"Сөйлемде сан жоқ. Мақала қай санға сүйенеді?", m:"Мысалы: «Мақала Маңғыстауда 2019 жылы 3 051 адам қайтыс болғанына, яғни 2017 жылдан 11,6 пайыз көп екеніне сүйенеді.» Сан табылмаса, бұл дата мақаласы емес: басқасын іздеңіз."},
 en:{h:"There's no number in your sentence. Which number is the story built on?", m:"For example: \"The story rests on 3,051 deaths in Mangystau in 2019, 11.6% more than in 2017.\" If there's no number, it isn't a data story: find another one."}},
s1chk:{kk:{h:"Тексеру тізімінің бәрі белгіленбеген.", m:"Мақалада сан жоқ, дереккөзі аталмаған не мәселе қоғамға маңызды емес болса, келесі қадамдарға жарамайды. Басқа мақала іздеңіз."},
 en:{h:"Not every checklist item is ticked.", m:"If there's no number, no named source or the issue doesn't matter to the public, the article won't carry you through the next steps. Find another one."}},
s1src:{kk:{h:"", m:"Дереккөз аталмаса, 2-қадамда төркінін іздеу өте қиын болады."}, en:{h:"", m:"Without a named source, tracing the origin in step 2 will be very hard."}},

/* --- 4-қадам: нөлдік жол --- */
confirm:{kk:{h:"Бұл жол гипотезаны растайтын шарт, жалған ететін шарт емес.",
  m:"Студенттердің ең жиі қатесі осы. Растайтын мысал әрқашан табылады. Жол «гипотезам жалған» деп аяқталуы керек және нені көрсек, бас тартатынымызды айтуы керек."},
 en:{h:"This is a condition that confirms the hypothesis, not one that would make it false.",
  m:"This is the most common mistake. You can always find a confirming example. The line has to end with \"my hypothesis is false\" and say what result would make you drop it."}},
nothreshold:{kk:{h:"Шек жоқ: 0,5 пайыздық өзгерістің өзі «дәлел» болып кетеді.",
  m:"Бірнеше жұмыста бір пайызға жетпейтін өзгеріс «дәлелденді» деп алынды. Шекті алдын ала жазыңыз: «кемінде 20 пайыз», «1 пайыздық тармақтан көп». Шек болмаса, үкім шығаруға сүйенеті нәрсе жоқ."},
 en:{h:"No threshold: a 0.5% change would count as \"proof\".",
  m:"In several projects, changes under 1% were called \"proved\". Write the threshold in advance: \"at least 20%\", \"more than 1 percentage point\". Without one, there's nothing to base a verdict on."}},
sourcename:{kk:{h:"Бұл дереккөздің аты, шарт емес.", m:"Дереккөз бөлек жолға жазылады. Мұнда датаның қандай нәтижесі гипотезаны құлататыны жазылады."},
 en:{h:"That's the name of a source, not a condition.", m:"The source goes on its own line. This line says what result in the data would sink the hypothesis."}},
restate:{kk:{h:"Бұл гипотезаның өзін қайталау.", m:"Тұжырымды қайталау оны теріске шығару емес. Сұраңыз: «Егер мен қателессем, датада не көрер едім?»"},
 en:{h:"That just repeats the hypothesis.", m:"Repeating a claim doesn't test it. Ask: \"If I'm wrong, what would the data show?\""}},
negation:{kk:{h:"Бұл жай терістеу: гипотезаның салыстыруы мен шегі жоғалды.",
  m:"«Өскен жоқ» деген жол көп нәрсені өткізіп жібереді. Гипотеза салыстыру туралы болса, жалған болу шарты да салыстыру туралы болуы керек және сан шегі болуы керек."},
 en:{h:"That's plain negation: the comparison and the threshold are gone.",
  m:"\"It didn't grow\" lets a lot slip through. If the hypothesis is about a comparison, the condition must be too, with a numeric threshold."}},
nodatanull:{kk:{h:"Дата табылмауы гипотезаны жалған етпейді.", m:"Бұл үшінші нәтиже: «дата жетпеді». Жалған болу шарты датаның нақты нәтижесі туралы."},
 en:{h:"Not finding data doesn't make a hypothesis false.", m:"That's a third outcome: \"not enough data\". The falsification condition is about an actual result in the data."}},
nullEmpty:{kk:{h:"«Егер дата ___ көрсетсе, гипотезам жалған» жолы бос.", m:"Бұл жол бос болса, гипотеза әлі жоқ. Студент жұмыстарында ең жиі кездесетін олқылық осы."},
 en:{h:"The \"If the data shows ___, my hypothesis is false\" line is empty.", m:"Without it, you don't have a hypothesis yet. It's the most common gap in student work."}},
nullConfirm:{kk:{h:"Жолыңыз «дұрыс» деп аяқталады: бұл растайтын шарт.", m:"Жолды «...гипотезам жалған» деп аяқтаңыз және датаның қандай нәтижесі гипотезаны құлататынын жазыңыз."},
 en:{h:"Your line ends with \"true\": that's a confirming condition.", m:"End it with \"...my hypothesis is false\" and say which result would sink it."}},
nullNoFalse:{kk:{h:"Жолда «гипотезам жалған» деген бөлік жоқ.", m:"Үлгі: «Егер дата өсімнің 20 пайыздан аз екенін көрсетсе, гипотезам жалған.»"},
 en:{h:"The line doesn't say \"my hypothesis is false\".", m:"Template: \"If the data shows growth under 20%, my hypothesis is false.\""}},
nullSource:{kk:{h:"Жолға дереккөздің аты жазылған, нәтиже жазылмаған.", m:"Дереккөз шарт емес. Шарт: датада қандай сан шықса, бас тартасыз."},
 en:{h:"The line names a source instead of a result.", m:"A source isn't a condition. The condition is the number that would make you give up."}},
nullRestate:{kk:{h:"Жолыңыз гипотезаның сөздерін қайталап тұр.", m:"Гипотезаны қайталау оны теріске шығару емес. Керісінше нәтижені сипаттаңыз: өзгеріс шектен аз, бағыты басқа не айырма жоқ."},
 en:{h:"Your line repeats the words of your hypothesis.", m:"Repeating isn't testing. Describe the opposite result: change below the threshold, the other direction, or no gap."}},
nullNoThr:{kk:{h:"Шек өрісінде сан жоқ. Бұл өріс міндетті.", m:"Шек: гипотезаны расталды деп санайтын ең кіші өзгеріс. Мысалы «5 пайыз», «1 пайыздық тармақ», «1,5 есе». Шексіз гипотезада 0,3 пайыздық өзгеріс те «дәлел» болып кетеді."},
 en:{h:"The threshold box has no number. It's required.", m:"The threshold is the smallest change you'd accept as support: \"5%\", \"1 percentage point\", \"1.5 times\". Without it, a 0.3% change becomes \"proof\"."}},
nullThrNotInLine:{kk:{h:"Шек бар, бірақ «егер дата...» жолында ол сан жоқ.", m:"Шекті жолдың өзіне кіргізіңіз: «Егер өсім 5 пайыздан аз болса, гипотезам жалған.»"},
 en:{h:"You set a threshold, but the \"If the data shows...\" line doesn't use it.", m:"Put the number into the line: \"If growth is under 5%, my hypothesis is false.\""}},
nullNoH0:{kk:{h:"Нөлдік гипотезаны (Н0) бір сөйлеммен жазыңыз.", m:"Н0: сізді құлата алатын ең қарапайым түсіндірме. Мысалы: «Мың адамға шаққандағы өлім өзгерген жоқ, тек халық көбейді.»"},
 en:{h:"Write your null hypothesis (H0) in one sentence.", m:"H0 is the simplest explanation that could kill your hypothesis. For example: \"The death rate per 1,000 didn't change; the population just grew.\""}},

/* --- 5-қадам: сан --- */
divnew:{kk:{h:"Жаңа санға бөлгенсіз. ЖЕБЕ: ескі санға бөлінеді.", m:"(Жаңа − Ескі) ÷ Ескі × 100. Бөлгіш әрқашан бастапқы жылдың саны."},
 en:{h:"You divided by the new number. DART divides by the old one (the reference).", m:"(New − Old) ÷ Old × 100. The denominator is always the starting year."}},
no100:{kk:{h:"100-ге көбейту ұмытылған: бұл үлес, пайыз емес.", m:"0,116 деген 11,6 пайыз. ЖЕБЕ-нің соңғы қадамы × 100."},
 en:{h:"You forgot × 100: that's a share, not a percentage.", m:"0.116 is 11.6%. The last move of DART is × 100."}},
diffonly:{kk:{h:"Бұл айырма ғана (Жаңа − Ескі). Енді ескі санға бөліп, 100-ге көбейтіңіз.", m:"Айырма абсолют өзгерісті береді. Пайыздық өзгеріс үшін оны бастапқы санға бөлесіз."},
 en:{h:"That's only the difference (New − Old). Now divide by the old number and multiply by 100.", m:"The difference is the absolute change. For a percentage change, divide it by the starting number."}},
ratio:{kk:{h:"Бұл қатынас (Жаңа ÷ Ескі × 100). Одан 100-ді алып тастаңыз.", m:"111,6 деген «2017 жылғы әр 100 адамға 2019 жылы 111,6 адам», яғни өсім 11,6 пайыз."},
 en:{h:"That's the ratio (New ÷ Old × 100). Subtract 100.", m:"111.6 means \"for every 100 in 2017, 111.6 in 2019\", i.e. growth of 11.6%."}},
wrongrow:{kk:{h:"Бұл басқа жолдың мәні. Кестеде дұрыс жолды (Маңғыстау не Қазақстан) алыңыз.", m:""},
 en:{h:"That's the value for the other row. Use the right row (Mangystau or Kazakhstan).", m:""}},
pcGen:{kk:{h:"Сәйкес емес. ЖЕБЕ-ні қадаммен қайталаңыз: Жаңа − Ескі, ескіге бөлу, × 100.", m:"Есеп:"},
 en:{h:"Doesn't match. Redo DART step by step: New − Old, divide by Old, × 100.", m:"Working:"}},
rateGen:{kk:{h:"Сәйкес емес. Формула: қайтыс болғандар ÷ сол жылдың халқы × 1000.", m:"Есеп:"},
 en:{h:"Doesn't match. Formula: deaths ÷ population of the same year × 1,000.", m:"Working:"}},
avgpop:{kk:{h:"Бұл бюроның ресми коэффициенті: ол жылдың орташа халқымен есептеледі. Тапсырмада жыл басындағы халықты алыңыз. Есептеу әдісі дұрыс, жауап есептелді.", m:""},
 en:{h:"That's the Bureau's official rate: it uses the average annual population. Here we use start-of-year population. Your method is right, so it counts.", m:""}},
per100:{kk:{h:"100-ге көбейткенсіз. Мұнда мың адамға шағамыз: × 1000.", m:""}, en:{h:"You multiplied by 100. Here we use per 1,000: × 1,000.", m:""}},
per1:{kk:{h:"× 1000 ұмытылған: бұл бір адамға келетін үлес.", m:"Сан ÷ халық өте кішкентай сан береді. 1000-ға көбейткенде «мың адамға неше адам» шығады."},
 en:{h:"You forgot × 1,000: that's the share per person.", m:"Count ÷ population is tiny. Multiplying by 1,000 gives \"per 1,000 people\"."}},
per100k:{kk:{h:"100 000-ға көбейткенсіз. Мұнда мың адамға шағамыз.", m:""}, en:{h:"You multiplied by 100,000. Here we use per 1,000.", m:""}},
inverted:{kk:{h:"Бөлшек төңкерілген: халық ÷ сан емес, сан ÷ халық.", m:"Алымында қайтыс болғандар, бөлімінде халық."},
 en:{h:"The fraction is upside down: count ÷ population, not population ÷ count.", m:"Deaths on top, population below."}},
wrongyear:{kk:{h:"Халық санын басқа жылдан алғансыз. Өлім мен халық бір жылдан болуы керек.", m:""},
 en:{h:"You took the population from a different year. Deaths and population must be from the same year.", m:""}},
absnotrate:{kk:{h:"Бұл абсолют санның өзгерісі (11,6). Сұрақ мың адамға шаққан көрсеткіштің өзгерісі туралы.", m:"4,25 пен 4,49-ды ЖЕБЕ-ге салыңыз. Абсолют сан мен көрсеткіштің айырмасы осы тапсырманың өзегі."},
 en:{h:"That's the change in the absolute number (11.6). The question asks about the change in the rate per 1,000.", m:"Run DART on 4.25 and 4.49. The gap between count and rate is the whole point here."}},
ppNotPct:{kk:{h:"Бұл айырма (4,49 − 4,25), пайыздық өзгеріс емес.", m:"0,24 деген мың адамға шаққандағы айырма. Пайыз үшін оны 4,25-ке бөліп, 100-ге көбейтіңіз."},
 en:{h:"That's the difference (4.49 − 4.25), not a percentage change.", m:"0.24 is the gap per 1,000. For a percentage, divide by 4.25 and multiply by 100."}},
popchange:{kk:{h:"Бұл халықтың өсімі (5,5). Сізге көрсеткіштің өсімі керек.", m:"Екеуі жақын, бірақ әртүрлі сан. Көрсеткіштің өсімі шамамен 5,6–5,8."},
 en:{h:"That's population growth (5.5). You need the change in the rate.", m:"Close, but a different number. The rate rose roughly 5.6–5.8%."}},

/* --- 5-қадам: шешім --- */
decRejWrong:{kk:{h:"Сандарға қараңыз: Маңғыстауда көрсеткіш 5,8 пайыз өсті, ел бойынша өзгерген жоқ.", m:"Айырма 5,8 пайыздық тармақ, шек 1. Шектен асты, сондықтан бұл кезең үшін гипотеза расталды."},
 en:{h:"Look at the numbers: Mangystau's rate rose 5.8%, the national rate didn't move.", m:"The gap is 5.8 points, the threshold is 1. It's above the threshold, so for this period the hypothesis is supported."}},
decHaveData:{kk:{h:"Кестеде шешім шығаруға жететін дата бар.", m:"«Дата жетпеді» деген нәтижені тек дата шынымен жоқ кезде қоямыз. Бұл жерде екі жылдың да өлімі мен халқы бар."},
 en:{h:"The table has enough data to decide.", m:"\"Not enough data\" is only for when the data really isn't there. Here you have deaths and population for every year."}},
decBaseYear:{kk:{h:"Әр жылды есептеңіз: 2016, 2017, 2018, 2019. Көрсеткіш жыл сайын өсті ме?", m:"4,46, 4,25, 4,55, 4,49. 2017 мен 2019 жылы көрсеткіш түскен. Бастапқы жыл ретінде 2017 таңдалса, өсім үлкен көрінеді, ал 2016 жылдан қарасақ, өсім 1 пайызға жетпейді."},
 en:{h:"Work out every year: 2016, 2017, 2018, 2019. Did the rate rise each year?", m:"4.46, 4.25, 4.55, 4.49. The rate fell in 2017 and 2019. Starting from 2017 makes the rise look big; from 2016 it's under 1%."}},
decCausal:{kk:{h:"Кестеде деңгейдің төмендігі көрінеді, бірақ «себебі» бөлігін ештеңе көрсетпейді.", m:"Себеп туралы бөлікті тексеру үшін жас құрамы керек. Ол жоқ, сондықтан дата жетпеді."},
 en:{h:"The table shows the lower rate, but nothing shows the \"because\".", m:"Testing the cause needs age data. You don't have it, so there isn't enough data."}},
decNoEvidence:{kk:{h:"Жоққа шығару үшін де дата керек. Кестеде жас туралы ештеңе жоқ.", m:"Гипотезаның себеп бөлігін не растайтын, не жоққа шығаратын сан бұл кестеде жоқ."},
 en:{h:"Rejecting it needs data too. There's nothing about age in the table.", m:"Nothing in this table can support or reject the \"because\" part."}},

/* --- 6-қадам --- */
notalt:{kk:{h:"Бұл дата негізгі балама түсіндірмені жоққа шығармайды.", m:"Өзіңізден сұраңыз: гипотезам жалған болса, мұны ең оңай түсіндіретін не? Халық саны ма, баға ма, шекара ма, әдіс пе? Сол түсіндірмені тексеретін дата керек."},
 en:{h:"This dataset doesn't rule out the main alternative explanation.", m:"Ask yourself: if I'm wrong, what's the simplest explanation? Population, prices, boundaries or a change of method? You need data that tests that."}},
popNotHere:{kk:{h:"Халық саны мұнда басты балама емес.", m:"Бір жылда халық екі есе өспейді, ал ақша туралы көрсеткіште басты тұзақ халық емес, баға."},
 en:{h:"Population isn't the main alternative here.", m:"Populations don't double in a year, and with money figures the main trap is prices, not population."}},
migFirst:{kk:{h:"Көші-қон ақылға қонымды, бірақ бір жылда үштен бірге азаю тым көп.", m:"Мұндай секіріс алдымен шекараның не әдістің өзгергенін білдіреді. Кестенің ескертпесін оқыңыз."},
 en:{h:"Migration is plausible, but losing a third in one year is too much.", m:"A jump like that usually means boundaries or method changed. Read the table's footnotes first."}},

/* --- 7-қадам --- */
stLeadNum:{kk:{h:"Лидте сан жоқ.", m:"Лид негізгі табылымды бір санмен айтады. Үлгідегі лидті қараңыз."}, en:{h:"No number in the lead.", m:"The lead states the main finding with one number. See the model lead."}},
stNutNum:{kk:{h:"Нат-графта сан жоқ.", m:""}, en:{h:"No number in the nut graf.", m:""}},
stNutCmp:{kk:{h:"Нат-графта салыстыру жоқ (ел бойынша, басқа облыс, басқа жыл).", m:"Үлгіде: «ал ел бойынша бұл көрсеткіш 7,21 деңгейінде қалды»."}, en:{h:"No comparison in the nut graf (national, another region, another year).", m:"In the model: \"while the national rate stayed flat at 7.21\"."}},
stNutDoubt:{kk:{h:"Нат-графта күмән жоқ: санның шегін не әлсіз жерін айтыңыз.", m:"Адал стори өз санының шегін айтады: «бірақ», «алайда». Үлгіде: бастапқы жыл әдеттен төмен болған."}, en:{h:"No doubt in the nut graf: say where the number is limited.", m:"An honest story names its limits: \"but\", \"however\". In the model: the starting year was unusually low."}},
stNutNext:{kk:{h:"Нат-графта келесі тексеру жоқ.", m:"Не тексерілмей қалды? Үлгіде: халықтың жас құрамы мен өлім себептері."}, en:{h:"No next check in the nut graf.", m:"What's still untested? In the model: age structure and causes of death."}},
stCausal:{kk:{h:"Мәтінде себеп тұжырым ретінде айтылған. Датада себеп жоқ болса, «болуы мүмкін» деп жазыңыз да, қалай тексерілетінін айтыңыз.", m:""},
 en:{h:"Your text states a cause as fact. If the data doesn't show it, write \"may\" and say how it could be checked.", m:""}},
stSrc:{kk:{h:"Дереккөз жолында органның аты, кестенің атауы және жылдары болуы керек.", m:"Үлгі: «Дереккөз: Ұлттық статистика бюросы, «Қайтыс болғандар саны» кестесі, 2016–2019.»"},
 en:{h:"The source line needs the body, the table name and the years.", m:"Template: \"Source: Bureau of National Statistics, table 'Number of deaths', 2016–2019.\""}}
};

</script>
<script>
/* ===== Гипотеза тренажері: қозғалтқыш. Мазмұн tx_kk.js, tx_en.js, data.js ішінде. =====
   Ешқандай дерек сыртқа жіберілмейді. localStorage тек ыңғайлылық үшін (try/catch ішінде). */
const $ = id => document.getElementById(id);
const KEY = "jur401_hyp_trainer_v1";
let LANG = "kk";
let S = {v:{}, pick:{}, tries:{}, checked:{}, score:{}};

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && s.v) S = Object.assign({v:{}, pick:{}, tries:{}, checked:{}, score:{}}, s); }catch(e){}
  try{ const l = localStorage.getItem(KEY + "_lang"); if(l === "en" || l === "kk") LANG = l; }catch(e){}
}
const t = (k, ...a) => { let v = TX[LANG][k]; if(v === undefined) v = TX.kk[k]; if(v === undefined) return "";
  return typeof v === "function" ? v(...a) : v; };
const L = o => o == null ? "" : (typeof o === "string" ? o : (o[LANG] != null ? o[LANG] : o.kk));
const E = (code, part) => { const e = ERR[code]; if(!e) return ""; return L(e[part]); };
const num = v => parseFloat(String(v).replace(/\s/g, "").replace("%", "").replace(",", "."));
function fmt(x, d){ const s = Number(x).toLocaleString(LANG === "kk" ? "ru-RU" : "en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
  return s.replace(/ /g, " "); }
const val = k => (S.v[k] == null ? "" : String(S.v[k])).trim();
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }

/* ---------- кері байланыс блогы ---------- */
function showFb(box, kind, msg, more, extra){
  box.className = "fb " + kind; box.innerHTML = "";
  const pre = kind === "ok" ? "✓ " : kind === "warn" ? "⚠ " : "✗ ";
  box.appendChild(el("div", null, pre + msg));
  if(extra) box.appendChild(el("div", "extra", extra));
  if(more){ const m = el("div", "more"); m.appendChild(el("b", null, t("more"))); m.appendChild(el("div", null, more)); box.appendChild(m); }
}
function showList(box, kind, head, items, mores){
  box.className = "fb " + kind; box.innerHTML = "";
  box.appendChild(el("div", null, (kind === "ok" ? "✓ " : kind === "warn" ? "⚠ " : "✗ ") + head));
  if(items.length){ const ul = el("ul"); items.forEach(i => ul.appendChild(el("li", null, i))); box.appendChild(ul); }
  if(mores && mores.length){ const m = el("div", "more"); m.appendChild(el("b", null, t("more")));
    mores.forEach(x => m.appendChild(el("p", null, x))); box.appendChild(m); }
}
function bump(key, count){ if(count) S.tries[key] = (S.tries[key] || 0) + 1; return S.tries[key] || 0; }

/* ---------- таңдау жаттығулары (mcq және sort) ---------- */
function optsOf(key, item){ const ex = EX[key]; return ex.cats ? ex.cats : item.opts; }
function renderEx(key){
  const ex = EX[key], box = $("ex_" + key); if(!box) return; box.innerHTML = "";
  ex.items.forEach((it, n) => {
    const d = el("div", "item");
    const q = el("div", "q", (n + 1) + ". " + L(it.q) + (it.sec ? '<span class="sec">' + L(OPTS.sectors.find(s => s.id === it.sec).t) + "</span>" : ""));
    d.appendChild(q);
    const o = el("div", "opts" + (ex.cats ? "" : " col"));
    optsOf(key, it).forEach(op => {
      const lab = el("label"); const r = document.createElement("input");
      r.type = "radio"; r.name = key + "_" + it.id; r.value = op.id;
      const pk = key + "." + it.id;
      if(S.pick[pk] === op.id){ r.checked = true; lab.classList.add("sel"); }
      r.onchange = () => { S.pick[pk] = op.id; save(); o.querySelectorAll("label").forEach(x => x.classList.remove("sel")); lab.classList.add("sel"); updateWs(); };
      lab.appendChild(r); lab.appendChild(el("span", null, L(op.t))); o.appendChild(lab);
    });
    d.appendChild(o);
    const f = el("div", "fb"); f.id = "fb_" + key + "_" + it.id; d.appendChild(f);
    box.appendChild(d);
  });
}
function sortCode(it, pick){
  if(it.ans === "topic") return "topic";
  if(it.ans === "question") return "question";
  if(it.ans === "weak") return pick === "strong" ? it.code : "isclaim";
  return pick === "weak" ? "strongok" : "isclaim";
}
function checkEx(key, count){
  const ex = EX[key]; let ok = 0;
  ex.items.forEach(it => {
    const pk = key + "." + it.id, pick = S.pick[pk], f = $("fb_" + key + "_" + it.id);
    if(!f) return;
    if(!pick){ showFb(f, "bad", t("choose")); return; }
    if(pick === it.ans){ ok++; showFb(f, "ok", L(it.why)); return; }
    const n = bump(pk, count);
    const code = ex.cats ? sortCode(it, pick) : (optsOf(key, it).find(o => o.id === pick) || {}).code;
    showFb(f, "bad", E(code, "h") || t("tryAgain"), n >= 2 ? [L(it.hint2 || it.why), E(code, "m")].filter(Boolean).join(" ") : null);
  });
  S.checked[key] = true; S.score[key] = ok + "/" + ex.items.length; save();
  $("sc_" + key).textContent = t("score", ok, ex.items.length);
  updateWs();
}

/* ---------- 5-қадам: кесте және сан жаттығуы ---------- */
function renderTable(){
  const D = DATA, b = $("t_table"); const yrs = [2016, 2017, 2018, 2019];
  let h = '<table class="ex"><thead><tr><th>' + t("tYear") + "</th><th>" + t("tMD") + "</th><th>" + t("tMP") + "</th><th>" + t("tKD") + "</th><th>" + t("tKP") + "</th></tr></thead><tbody>";
  yrs.forEach(y => { h += "<tr><td>" + y + "</td><td>" + fmt(D.M.d[y], 0) + "</td><td>" + fmt(D.M.p[y], 0) + "</td><td>" + fmt(D.K.d[y], 0) + "</td><td>" + fmt(D.K.p[y], 0) + "</td></tr>"; });
  b.innerHTML = h + "</tbody></table>";
}
function renderNum(){
  const b = $("ex_num"); b.innerHTML = "";
  NUM.forEach((it, n) => {
    const w = el("div", "num");
    const lab = el("label", null, (n + 1) + ". " + L(it.q)); lab.htmlFor = "n_" + it.id;
    const inp = document.createElement("input"); inp.id = "n_" + it.id; inp.inputMode = "decimal"; inp.autocomplete = "off";
    inp.value = S.v["n_" + it.id] || "";
    inp.oninput = () => { S.v["n_" + it.id] = inp.value; save(); };
    const f = el("div", "fb"); f.id = "fb_n_" + it.id;
    w.appendChild(lab); w.appendChild(inp); w.appendChild(f); b.appendChild(w);
  });
}
function checkNum(count){
  let ok = 0;
  NUM.forEach(it => {
    const f = $("fb_n_" + it.id), raw = S.v["n_" + it.id], x = num(raw), key = "n." + it.id;
    if(raw == null || String(raw).trim() === ""){ showFb(f, "bad", t("needNum")); return; }
    if(!isFinite(x)){ showFb(f, "bad", t("needNum")); return; }
    if(x >= it.lo && x <= it.hi){ ok++; showFb(f, "ok", L(it.why)); return; }
    const c = (it.cands || []).find(c => Math.abs(x - c.v) <= (c.tol != null ? c.tol : Math.max(0.011, Math.abs(c.v) * 0.004)));
    if(c && c.ok){ ok++; showFb(f, "warn", E(c.code, "h"), null, L(it.why)); return; }
    const n = bump(key, count), code = c ? c.code : it.gen;
    showFb(f, "bad", E(code, "h"), n >= 2 ? [E(code, "m"), L(it.calc)].filter(Boolean).join(" ") : null);
  });
  S.checked.num = true; S.score.num = ok + "/" + NUM.length; save();
  $("sc_num").textContent = t("score", ok, NUM.length);
  updateWs();
}

/* ---------- 1-қадам: мақала ---------- */
function checkS1(count){
  const iss = [], codes = [];
  if(!val("art_sector")){ iss.push(E("s1sector", "h")); codes.push("s1sector"); }
  if(!/^https?:\/\/[^\s.]+\.[^\s]+/i.test(val("art_link"))){ iss.push(E("s1link", "h")); codes.push("s1link"); }
  if(!/\d/.test(val("art_number"))){ iss.push(E("s1num", "h")); codes.push("s1num"); }
  if(!S.v.art_c1 || !S.v.art_c2 || !S.v.art_c3 || !S.v.art_c4){ iss.push(E("s1chk", "h")); codes.push("s1chk"); }
  if(!S.v.art_c2){ codes.push("s1src"); }
  const f = $("f_s1");
  if(!iss.length){ showFb(f, "ok", t("s1ok")); S.checked.s1 = true; save(); return; }
  const n = bump("s1", count);
  showList(f, "bad", t("fixThese"), iss, n >= 2 ? [...new Set(codes)].map(c => E(c, "m")).filter(Boolean) : null);
  save();
}

/* ---------- 2-қадам: өз датаңыздың төркіні ---------- */
function yearsOf(s){ const m = String(s).match(/(19|20)\d\d/g); return m ? m.map(Number) : []; }
function checkS2(count){
  const iss = [], codes = [], f = $("f_s2"), ty = val("or_type");
  if(!val("or_body")){ iss.push(E("s2body", "h")); codes.push("s2body"); }
  if(!val("or_table")){ iss.push(E("s2table", "h")); codes.push("s2table"); }
  if(yearsOf(val("or_years")).length < 2){ iss.push(E("s2years", "h")); codes.push("s2years"); }
  if(!val("or_level")){ iss.push(E("s2level", "h")); codes.push("s2level"); }
  if(!ty){ iss.push(E("s2type", "h")); codes.push("s2type"); }
  const red = ["press", "article", "person", "pct"].includes(ty);
  if(red){ iss.unshift(E("srcRed", "h")); codes.unshift("srcRed"); }
  if(val("or_primary") === "second"){ iss.push(E("srcSecond", "h")); codes.push("srcSecond"); }
  if(val("or_primary") === "unknown"){ iss.push(E("srcUnknown", "h")); codes.push("srcUnknown"); }
  if(!iss.length){ showFb(f, "ok", ty === "report" ? t("s2okYellow") : t("s2ok")); S.checked.s2 = true; save(); updateWs(); return; }
  const n = bump("s2", count);
  showList(f, red ? "bad" : "warn", red ? t("s2red") : t("fixThese"), iss, n >= 2 ? [...new Set(codes)].map(c => E(c, "m")).filter(Boolean) : null);
  save(); updateWs();
}

/* ---------- 3-қадам: гипотеза құрастырғыш ---------- */
function preview(){
  const g = k => val(k) ? "<b>" + esc(val(k)) + "</b>" : '<span class="gap">[' + t("gap_" + k) + "]</span>";
  const per = (val("b_from") || val("b_to")) ? "<b>" + esc(val("b_from") || "?") + "–" + esc(val("b_to") || "?") + "</b>" : '<span class="gap">[' + t("gap_period") + "]</span>";
  let h = t("previewTpl", per, g("b_where"), g("b_what"), g("b_change"), g("b_cmp"));
  if(val("b_why")) h += " <i>" + t("previewWhy", esc(val("b_why"))) + "</i>";
  $("b_preview").innerHTML = h;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c])); }
function plainPreview(){ return $("b_preview").textContent.replace(/\[[^\]]*\]/g, "...").replace(/\s+/g, " ").trim(); }
const LEVEL_RANK = {country:0, oblast:1, city:2, district:2, inst:3};
function hypIssues(){
  const txt = val("hyp_final"), out = [];
  const add = (code, kind) => out.push({code, kind: kind || "bad"});
  const R = RULES;
  if(!txt){ add("hypEmpty"); return out; }
  if(R.question.test(txt)) add("question");
  if(R.plan.test(txt)) add("plan");
  if(txt.split(/\s+/).length < 6) add("topic");
  const yrs = yearsOf(txt);
  if(yrs.length < 2) add("noperiod");
  if(!val("b_where")) add("noplace");
  if(!R.compare.test(txt) && !val("b_cmp")) add("nocompare");
  if(!val("b_kind")) add("kindmissing");
  else if(val("b_kind") === "count" && (R.compare.test(txt) || val("b_cmp"))) add("absrate", "warn");
  if(!val("b_unit")) add("nounit", "warn");
  if(R.causal.test(txt) || val("b_why")) add("causal", "warn");
  if(R.vague.test(txt)) add("vague", "warn");
  if(R.two.test(txt)) add("twoclaims", "warn");
  const oy = yearsOf(val("or_years"));
  if(yrs.length >= 2 && oy.length >= 2){ const lo = Math.min(...oy), hi = Math.max(...oy);
    if(Math.min(...yrs) < lo || Math.max(...yrs) > hi) add("fitperiod"); }
  const bl = val("b_level"), ol = val("or_level");
  if(bl && ol && LEVEL_RANK[bl] > LEVEL_RANK[ol]) add("fitlevel");
  if(bl && ol && bl !== ol && LEVEL_RANK[bl] === LEVEL_RANK[ol]) add("fitlevel", "warn");
  return out;
}
function checkS3(count){
  const f = $("f_s3"), iss = hypIssues();
  if(!iss.length){ showFb(f, "ok", t("s3ok")); S.checked.s3 = true; save(); updateWs(); return; }
  const hard = iss.filter(i => i.kind === "bad");
  const n = hard.length ? bump("s3", count) : (S.tries.s3 || 0);
  showList(f, hard.length ? "bad" : "warn", hard.length ? t("fixThese") : t("s3warn"),
    iss.map(i => (i.kind === "warn" ? "⚠ " : "") + E(i.code, "h")),
    (n >= 2 || !hard.length) ? iss.map(i => E(i.code, "m")).filter(Boolean) : null);
  save(); updateWs();
}

/* ---------- 4-қадам: өз нөлдік гипотезаңыз ---------- */
function words(s){ return new Set(String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(w => w.length > 3)); }
function overlap(a, b){ const A = words(a), B = words(b); if(!A.size || !B.size) return 0; let n = 0; A.forEach(w => { if(B.has(w)) n++; }); return n / Math.min(A.size, B.size); }
function checkS4(count){
  const f = $("f_s4"), line = val("null_line"), thr = val("null_thr"), iss = [];
  const R = RULES;
  if(!line) iss.push("nullEmpty");
  else{
    if(R.confirm.test(line)) iss.push("nullConfirm");
    else if(!R.falsePhrase.test(line)) iss.push("nullNoFalse");
    if(R.source.test(line) && !/\d/.test(line)) iss.push("nullSource");
    if(val("hyp_final") && overlap(line, val("hyp_final")) > 0.8 && !R.negation.test(line)) iss.push("nullRestate");
  }
  if(!/\d/.test(thr)) iss.push("nullNoThr");
  else if(!/\d/.test(line)) iss.push("nullThrNotInLine");
  if(!val("null_h0")) iss.push("nullNoH0");
  if(!iss.length){ showFb(f, "ok", t("s4ok")); S.checked.s4 = true; save(); updateWs(); return; }
  const n = bump("s4", count);
  showList(f, "bad", t("fixThese"), iss.map(c => E(c, "h")), n >= 2 ? iss.map(c => E(c, "m")).filter(Boolean) : null);
  save(); updateWs();
}

/* ---------- 7-қадам: өз үш сөйлеміңіз ---------- */
function checkS7(count){
  const f = $("f_s7"), R = RULES, iss = [];
  const lead = val("st_lead"), nut = val("st_nut"), src = val("st_src");
  if(!/\d/.test(lead)) iss.push("stLeadNum");
  if(!/\d/.test(nut)) iss.push("stNutNum");
  if(!R.compare.test(nut)) iss.push("stNutCmp");
  if(!R.doubt.test(nut)) iss.push("stNutDoubt");
  if(!R.next.test(nut)) iss.push("stNutNext");
  if(R.causal.test(lead + " " + nut)) iss.push("stCausal");
  if(!R.source.test(src) || yearsOf(src).length < 1) iss.push("stSrc");
  if(!iss.length){ showFb(f, "ok", t("s7ok")); S.checked.s7 = true; save(); updateWs(); return; }
  const n = bump("s7", count);
  showList(f, "bad", t("fixThese"), iss.map(c => E(c, "h")), n >= 2 ? iss.map(c => E(c, "m")).filter(Boolean) : null);
  save(); updateWs();
}

/* ---------- жұмыс парағы ---------- */
function optLabel(list, id){ const o = (OPTS[list] || []).find(x => x.id === id); return o ? L(o.t) : ""; }
function wsText(){
  const W = (k) => val(k) || t("wsEmpty");
  const lines = [];
  const H = s => { lines.push(""); lines.push(s); lines.push("-".repeat(Math.min(60, s.length))); };
  lines.push(t("h1")); lines.push(t("sub"));
  if(val("ws_name")) lines.push(t("ws_nameL") + ": " + val("ws_name"));
  lines.push(t("wsDate") + ": " + new Date().toISOString().slice(0, 10));
  H(t("s1h"));
  lines.push(t("art_sectorL") + ": " + (optLabel("sectors", val("art_sector")) || t("wsEmpty")));
  lines.push(t("art_linkL") + ": " + W("art_link"));
  lines.push(t("art_numberL") + ": " + W("art_number"));
  lines.push(t("wsChecklist") + ": " + [1, 2, 3, 4].map(i => (S.v["art_c" + i] ? "[x] " : "[ ] ") + t("art_c" + i).replace(/<[^>]+>/g, "")).join(" · "));
  H(t("s2h"));
  ["or_body", "or_table", "or_years"].forEach(k => lines.push(t(k + "L") + ": " + W(k)));
  lines.push(t("or_levelL") + ": " + (optLabel("levels", val("or_level")) || t("wsEmpty")));
  lines.push(t("or_typeL") + ": " + (optLabel("srcTypes", val("or_type")) || t("wsEmpty")));
  lines.push(t("or_primaryL") + ": " + (optLabel("primary", val("or_primary")) || t("wsEmpty")));
  H(t("s3h"));
  lines.push(t("wsBuilder") + ": " + plainPreview());
  lines.push(t("b_kindL") + ": " + (optLabel("kinds", val("b_kind")) || t("wsEmpty")) + " · " + t("b_unitL") + ": " + W("b_unit"));
  if(val("b_why")) lines.push(t("b_whyL") + ": " + val("b_why") + " (" + t("wsWhyFlag") + ")");
  lines.push(t("hyp_finalL") + ": " + W("hyp_final"));
  H(t("s4h"));
  lines.push(t("null_lineL") + ": " + W("null_line"));
  lines.push(t("null_thrL") + ": " + W("null_thr"));
  lines.push(t("null_h0L") + ": " + W("null_h0"));
  H(t("s5h"));
  lines.push(t("own_numbersL") + ": " + W("own_numbers"));
  lines.push(t("own_verdictL") + ": " + (optLabel("verdicts", val("own_verdict")) || t("wsEmpty")) + (val("own_verdict_num") ? " · " + val("own_verdict_num") : ""));
  H(t("s6h"));
  lines.push(t("ex_altL") + ": " + W("ex_alt"));
  lines.push(t("ex_data2L") + ": " + W("ex_data2"));
  H(t("s7h"));
  lines.push(t("st_leadL") + ": " + W("st_lead"));
  lines.push(t("st_nutL") + ": " + W("st_nut"));
  lines.push(t("st_srcL") + ": " + W("st_src"));
  H(t("wsScores"));
  ["origin", "sort", "null", "num", "dec", "extra"].forEach(k => lines.push(t("wsEx_" + k) + ": " + (S.score[k] || t("wsNotDone"))));
  lines.push(""); lines.push(t("wsFooter"));
  return lines.join("\n");
}
function updateWs(){ $("ws_out").textContent = wsText(); }
function copyWs(){
  const s = wsText(), f = $("f_ws");
  const done = () => showFb(f, "ok", t("wsCopied"));
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = s; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ showFb(f, "bad", t("wsCopyFail")); } ta.remove(); };
  try{ if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(done, fallback); else fallback(); }catch(e){ fallback(); }
}
function dlWs(){
  const blob = new Blob(["﻿" + wsText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = t("wsFile") + (val("ws_name") ? "_" + val("ws_name").replace(/[^\p{L}\p{N}]+/gu, "_") : "") + ".txt";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function clearAll(){
  if(!confirm(t("wsClearQ"))) return;
  S = {v:{}, pick:{}, tries:{}, checked:{}, score:{}}; save(); location.reload();
}

/* ---------- тіл және бастапқы жүктеу ---------- */
function fillSelect(sel, list){
  const cur = S.v[sel.dataset.k] || ""; sel.innerHTML = "";
  const o0 = document.createElement("option"); o0.value = ""; o0.textContent = t("choose"); sel.appendChild(o0);
  list.forEach(x => { const o = document.createElement("option"); o.value = x.id; o.textContent = L(x.t); sel.appendChild(o); });
  sel.value = cur;
}
function applyLang(){
  document.documentElement.lang = LANG === "kk" ? "kk" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(e => { e.innerHTML = t(e.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll("select[data-opts]").forEach(s => fillSelect(s, OPTS[s.dataset.opts]));
  fillSelect($("art_sector"), OPTS.sectors);
  $("lkk").classList.toggle("on", LANG === "kk"); $("len").classList.toggle("on", LANG === "en");
  $("nav").innerHTML = TX[LANG].nav.map((n, i) => '<a href="#' + (i < 7 ? "s" + (i + 1) : "ws") + '">' + n + "</a>").join("");
  ["origin", "sort", "null", "dec", "extra"].forEach(renderEx);
  renderTable(); renderNum();
  $("story").innerHTML = L(STORY);
  preview();
  $("s4hyp").textContent = val("hyp_final") ? t("s4yourHyp") + " " + val("hyp_final") : t("s4noHyp");
  // бұрын тексерілген жаттығудың кері байланысын жаңа тілде қайта көрсету (әрекет саны өзгермейді)
  ["origin", "sort", "null", "dec", "extra"].forEach(k => { if(S.checked[k]) checkEx(k, false); else $("sc_" + k).textContent = ""; });
  if(S.checked.num) checkNum(false); else $("sc_num").textContent = "";
  [["s1", checkS1], ["s2", checkS2], ["s3", checkS3], ["s4", checkS4], ["s7", checkS7]].forEach(([k, fn]) => { if(S.tries[k] || S.checked[k]) fn(false); });
  updateWs();
}
function setLang(l){ LANG = l; try{ localStorage.setItem(KEY + "_lang", l); }catch(e){} applyLang(); }

function bindInputs(){
  document.querySelectorAll("[data-k]").forEach(e => {
    const k = e.dataset.k;
    if(e.type === "checkbox"){ e.checked = !!S.v[k]; e.onchange = () => { S.v[k] = e.checked; save(); updateWs(); }; return; }
    if(e.tagName !== "SELECT") e.value = S.v[k] || "";
    const h = () => { S.v[k] = e.value; save(); if(k.startsWith("b_")) preview(); if(k === "hyp_final") $("s4hyp").textContent = t("s4yourHyp") + " " + e.value; updateWs(); };
    e.addEventListener("input", h); e.addEventListener("change", h);
  });
}
function init(){
  load();
  bindInputs();
  $("lkk").onclick = () => setLang("kk"); $("len").onclick = () => setLang("en");
  document.querySelectorAll("[data-check]").forEach(b => b.onclick = () => checkEx(b.dataset.check, true));
  $("b_s1").onclick = () => checkS1(true);
  $("b_s2").onclick = () => checkS2(true);
  $("b_s3").onclick = () => checkS3(true);
  $("b_s4").onclick = () => checkS4(true);
  $("b_s7").onclick = () => checkS7(true);
  $("b_num").onclick = () => checkNum(true);
  $("b_fill").onclick = () => { const p = plainPreview(); if(val("hyp_final") && !confirm(t("fillQ"))) return;
    $("hyp_final").value = p; S.v.hyp_final = p; save(); $("s4hyp").textContent = t("s4yourHyp") + " " + p; updateWs(); };
  $("ws_copy").onclick = copyWs; $("ws_dl").onclick = dlWs; $("ws_clear").onclick = clearAll;
  applyLang();
}
init();

</script>
